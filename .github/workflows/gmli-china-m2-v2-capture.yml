name: GMLI official PBoC M2 v2 capture

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-pboc-m2-official-v2.py'
      - 'scripts/extend-pboc-m2-v2-2014.py'
      - 'research/china-m2-official-v2-contract.json'
      - 'research/china-m2-official-v2-2015-growth-manifest.json'
      - '.github/workflows/gmli-china-m2-v2-capture.yml'

permissions:
  contents: write

concurrency:
  group: gmli-china-m2-v2-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GMLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build official PBoC V2 with locked comparable-base seed
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extend-pboc-m2-v2-2014.py --build-full | tee /tmp/gmli-pboc-v2-build.json
          grep -q '"status": "PASS_CONTINUOUS_OFFICIAL_V2_SOURCE_WITH_COMPARABLE_BASE_SEED"' /tmp/gmli-pboc-v2-build.json
          grep -q '"candidate_version": "PBOC_OFFICIAL_M2_V2"' /tmp/gmli-pboc-v2-build.json
          grep -q '"start_month": "2014-01"' /tmp/gmli-pboc-v2-build.json
          grep -q '"missing_months": \[\]' /tmp/gmli-pboc-v2-build.json
          grep -q '"role": "ACCOUNTING_SEED_ONLY"' /tmp/gmli-pboc-v2-build.json
          grep -q '"observed_stock": false' /tmp/gmli-pboc-v2-build.json
          grep -q '"search_ranking_dependency": false' /tmp/gmli-pboc-v2-build.json
          grep -q '"url_lock_contract": "PBOC_OFFICIAL_2015_GROWTH_LOCK_V1"' /tmp/gmli-pboc-v2-build.json

      - name: Guard promoted Money V2 contract and historical reference
        run: |
          grep -q "version: 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL'" lib/state.js
          grep -q "status: 'CORE_HISTORICAL_REFERENCE'" lib/state.js
          grep -q "available_date: '2026-02-28'" lib/state.js
          grep -q "BLOCKED_MISSING_FROZEN_INPUT_BYTES" lib/state.js

      - name: Upload PBoC v2 audit
        uses: actions/upload-artifact@v4
        with:
          name: gmli-pboc-m2-v2-capture
          path: |
            audit/china-m2-official-v2.json
            research/china-m2-official-v2/latest/
          if-no-files-found: error
          retention-days: 90

      - name: Commit verified source archive only when changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- research/china-m2-official-v2/latest)" ]; then
            echo 'No PBoC M2 v2 source change; no commit needed.'
            exit 0
          fi
          git config user.name 'gmli-refresh-bot'
          git config user.email 'gmli-refresh-bot@users.noreply.github.com'
          git add research/china-m2-official-v2/latest
          git commit -m 'Refresh official PBoC M2 v2 source archive'
          git push origin HEAD:main
