name: GMLI reverse overlay mechanism research

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/reverse-overlay-mechanism/**'
      - 'scripts/test-reverse-overlay-mechanism.py'
      - 'scripts/run-reverse-overlay-mechanism.py'
      - 'research/fiscal-v2/latest/history.csv'
      - 'research/funding-v2/latest/history.csv'
      - '.github/workflows/gmli-reverse-overlay-research.yml'
  workflow_dispatch:

jobs:
  reverse-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels
      - name: Guard frozen research boundary
        run: |
          python - <<'PY'
          import json
          s=json.load(open('research/reverse-overlay-mechanism/RESEARCH_SPEC.json'))
          assert s['study_version']=='GMLI_REVERSE_OVERLAY_MECHANISM_V1'
          assert s['status']=='FROZEN_BEFORE_EMPIRICAL_RUN'
          assert s['primary_assets']==['SPY','QQQ']
          assert s['tests']['bidirectional_granger']['lags_months']==[1,3,6]
          assert all(v is False for v in s['no_search'].values())
          assert s['production_modified'] is False
          assert s['automatic_weight_change']==0
          print('PASS_REVERSE_RESEARCH_FROZEN_BOUNDARY')
          PY
      - name: Run fixed reverse mechanism diagnostics
        run: |
          python scripts/run-reverse-overlay-mechanism.py --as-of 2026-08-25 --output /tmp/reverse-overlay-result.json
          grep -q '"status": "INFORMATIONAL_REVERSE_OVERLAY_RESEARCH_COMPLETE"' /tmp/reverse-overlay-result.json
          grep -q '"production_implication": "NONE"' /tmp/reverse-overlay-result.json
          grep -q '"automatic_weight_change": 0' /tmp/reverse-overlay-result.json
      - name: Guard production separation
        run: |
          grep -q "version: 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL'" lib/state.js
          grep -q "version: 'GMLI_FUNDING_V2_EFFECTIVE_CONDITIONS'" lib/state.js
          grep -q "version: 'GMLI_FISCAL_V2_DEFICIT_IMPULSE'" lib/state.js
          grep -q "fiscal_v2_automatic_weight: 0" lib/decision-engine.js
          grep -q "max: 10" lib/decision-engine.js
          git diff --exit-code -- lib api || (echo 'Research workflow modified production files' && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: gmli-reverse-overlay-mechanism-research
          path: /tmp/reverse-overlay-result.json
          if-no-files-found: error
          retention-days: 90
