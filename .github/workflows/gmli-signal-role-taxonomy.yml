name: GMLI signal role taxonomy research

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/signal-role-taxonomy/**'
      - 'scripts/test-signal-role-taxonomy.py'
      - 'research/global-money-v2/latest/global_money_v2.csv'
      - '.github/workflows/gmli-signal-role-taxonomy.yml'
  workflow_dispatch:

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels
      - name: Guard frozen taxonomy boundary
        run: |
          python - <<'PY'
          import json
          s=json.load(open('research/signal-role-taxonomy/RESEARCH_SPEC.json'))
          assert s['study_version']=='GMLI_SIGNAL_ROLE_TAXONOMY_V1'
          assert s['status']=='FROZEN_BEFORE_MONEY_DIRECTION_TEST'
          assert s['money_direction_protocol']['lags_months']==[1,3,6]
          assert all(v is False for v in s['no_search'].values())
          assert s['production_modified'] is False
          assert s['automatic_weight_change']==0
          print('PASS_SIGNAL_ROLE_TAXONOMY_FROZEN_BOUNDARY')
          PY
      - name: Run fixed Money direction test
        run: |
          python scripts/test-signal-role-taxonomy.py --as-of 2026-08-25 --output /tmp/signal-role-taxonomy.json
          grep -q '"status": "INFORMATIONAL_SIGNAL_ROLE_TAXONOMY_COMPLETE"' /tmp/signal-role-taxonomy.json
          grep -q '"production_implication": "NONE"' /tmp/signal-role-taxonomy.json
          grep -q '"automatic_weight_change": 0' /tmp/signal-role-taxonomy.json
      - name: Guard production separation
        run: |
          grep -q "version: 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL'" lib/state.js
          grep -q "version: 'GMLI_FUNDING_V2_EFFECTIVE_CONDITIONS'" lib/state.js
          grep -q "version: 'GMLI_FISCAL_V2_DEFICIT_IMPULSE'" lib/state.js
          grep -q "fiscal_v2_automatic_weight: 0" lib/decision-engine.js
          grep -q "max: 10" lib/decision-engine.js
      - uses: actions/upload-artifact@v4
        with:
          name: gmli-signal-role-taxonomy-research
          path: /tmp/signal-role-taxonomy.json
          if-no-files-found: error
          retention-days: 90
