name: GMLI prospective Fiscal source capture

on:
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-prospective-fiscal-inputs.py'
      - '.github/workflows/gmli-fiscal-prospective-capture.yml'

permissions:
  contents: write

concurrency:
  group: gmli-fiscal-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GMLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture prospective Fiscal raw sources
        run: python scripts/capture-prospective-fiscal-inputs.py

      - name: Guard frozen production state
        run: |
          grep -q "available_date: '2026-02-28'" lib/state.js
          grep -q "usd_score: 65.70290344348" lib/state.js
          grep -q "fxn_score: 43.01411281977772" lib/state.js
          grep -q "z: 0.1523733868591229" lib/state.js
          grep -q "score: 52.539556447652046" lib/state.js
          grep -q "mode: 'STRICT_ACTUAL_RELEASE'" lib/state.js
          grep -q '"production_state_modified": false' research/fiscal-prospective/latest/manifest.json
          grep -q '"strict_release_ready": false' research/fiscal-prospective/latest/manifest.json

      - name: Upload prospective Fiscal audit
        uses: actions/upload-artifact@v4
        with:
          name: gmli-fiscal-prospective-capture
          path: |
            audit/fiscal-prospective-capture.json
            research/fiscal-prospective/latest/
          if-no-files-found: error
          retention-days: 90

      - name: Commit source vintage only when bytes changed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- research/fiscal-prospective/latest)" ]; then
            echo 'No prospective Fiscal source-byte change; no commit needed.'
            exit 0
          fi
          git config user.name 'gmli-refresh-bot'
          git config user.email 'gmli-refresh-bot@users.noreply.github.com'
          git add research/fiscal-prospective/latest
          git commit -m 'Capture prospective GMLI Fiscal source vintage'
          git push origin HEAD:main
