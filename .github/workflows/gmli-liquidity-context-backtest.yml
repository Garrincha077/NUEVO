name: GMLI Liquidity Context backtest

on:
  push:
    branches:
      - research/liquidity-context-backtest
    paths:
      - 'research/liquidity-context-backtest/**'
      - '.github/workflows/gmli-liquidity-context-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy requests

      - name: Run fixed backtest
        run: |
          set -euo pipefail
          python research/liquidity-context-backtest/run_backtest_v4.py | tee /tmp/liquidity-context-backtest.log
          test -s research/liquidity-context-backtest/out/RESULTS.csv
          test -s research/liquidity-context-backtest/out/RESULT_SUMMARY.json
          test -s research/liquidity-context-backtest/out/RESULT_SUMMARY.md
          grep -q 'RESEARCH_DIAGNOSTIC' research/liquidity-context-backtest/out/RESULT_SUMMARY.json
          grep -q '"fixed_tests": 24' research/liquidity-context-backtest/out/RESULT_SUMMARY.json

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-context-backtest-v1
          path: research/liquidity-context-backtest/out/
          if-no-files-found: error
