name: GMLI deploy to existing Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gmli-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_JWLznbfg7CaiWzanxHONivzH
      VERCEL_PROJECT_ID: prj_Q1wLBL4qYx7KkJzhr24xeGAl0X3m
      PROD_BASE: https://gmli-fred-dashboard.vercel.app
    steps:
      - name: Checkout GMLI only
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax and Money V2 production guard
        shell: bash
        run: |
          set -euo pipefail
          find api lib -name '*.js' -print0 | xargs -0 -n1 node --check

          # Active promoted Money V2 data vintage.
          grep -q "observation_month: '2026-06'" lib/money-v2-active.js
          grep -q "available_date: '2026-07-31'" lib/money-v2-active.js
          grep -q "usd_score: 55.1121" lib/money-v2-active.js
          grep -q "fxn_score: 44.488" lib/money-v2-active.js

          # Frozen promoted methodology + explicit promotion gate.
          grep -q "status: 'FROZEN_V2_SPEC'" lib/state.js
          grep -q "version: 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL'" lib/state.js
          grep -q "status: 'PASS_MONEY_V2_PRODUCTION_PROMOTION'" lib/state.js
          grep -q "status: 'PASS_6_OF_6'" lib/state.js

          # Pre-V2 Core and historical v1.8b blocker remain audit references.
          grep -q "status: 'CORE_HISTORICAL_REFERENCE'" lib/state.js
          grep -q "available_date: '2026-02-28'" lib/state.js
          grep -q "usd_score: 65.70290344348" lib/state.js
          grep -q "fxn_score: 43.01411281977772" lib/state.js
          grep -q "BLOCKED_MISSING_FROZEN_INPUT_BYTES" lib/state.js
          test ! -e makro-cockpit

      - name: Detect Vercel credential without exposing it
        id: credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Vercel credential available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_TOKEN secret. Production deploy will be safely skipped."
          fi

      - name: Install Vercel CLI
        if: steps.credential.outputs.available == 'true'
        run: npm install --global vercel@latest

      - name: Bind exact existing GMLI project
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production settings
        if: steps.credential.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: steps.credential.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt artifact
        if: steps.credential.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke-test canonical Money V2 production
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base = process.env.PROD_BASE;
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function json(path) {
            let last;
            for (let i = 0; i < 12; i++) {
              try {
                const r = await fetch(base + path, { cache: 'no-store' });
                if (!r.ok) throw new Error(`${path} -> HTTP ${r.status}`);
                const j = await r.json();
                if (j?.error) throw new Error(`${path} -> ${j.error}`);
                return j;
              } catch (e) {
                last = e;
                await sleep(5000);
              }
            }
            throw last;
          }

          const paths = ['/api/status','/api/decision','/api/report','/api/money-nowcast','/api/current-market'];
          const out = {};
          for (const path of paths) {
            out[path] = await json(path);
            console.log('OK', path);
          }

          const s = out['/api/status'];
          if (s?.methodology?.status !== 'FROZEN_V2_SPEC') throw new Error('Active frozen methodology is not V2');
          if (s?.money?.version !== 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL') throw new Error('Money V2 is not active Core');
          if (s?.money?.available_date !== '2026-07-31') throw new Error(`Unexpected active Money date ${s?.money?.available_date}`);
          if (Math.abs(Number(s?.money?.usd_score) - 55.1121) > 1e-6) throw new Error('Unexpected active USD score');
          if (Math.abs(Number(s?.money?.fxn_score) - 44.488) > 1e-6) throw new Error('Unexpected active FX-neutral score');
          if (s?.money?.promotion_gate?.status !== 'PASS_MONEY_V2_PRODUCTION_PROMOTION') throw new Error('Money V2 promotion gate not PASS');
          if (s?.money?.historical_reference?.available_date !== '2026-02-28') throw new Error('Pre-V2 Core audit reference missing');
          if (s?.money?.historical_v18b_candidate?.promotion_gate?.status !== 'BLOCKED_MISSING_FROZEN_INPUT_BYTES') throw new Error('Historical v1.8b audit blocker changed unexpectedly');

          const r = out['/api/report'];
          if (r?.schema_version !== 'gmli-report-v1.4') throw new Error('Canonical report schema is not v1.4');
          if (r?.regime?.engine_fact?.money?.available_date !== '2026-07-31') throw new Error('Canonical report is not using active Money V2');
          if (r?.data_health?.status === 'DEGRADED_CORE_STALE') throw new Error('Data Health still treats pre-V2 Core as active');

          const n = out['/api/money-nowcast'];
          if (n?.source_mode !== 'LIVE_OFFICIAL_WITH_LAST_VERIFIED_FALLBACK') throw new Error('Live Money freshness layer not active');

          console.log('Money V2 active; historical Core preserved; canonical production smoke PASS.');
          NODE

      - name: Safe no-credential result
        if: steps.credential.outputs.available != 'true'
        run: echo "GMLI source is ready and validated; Vercel production was not touched because no deploy credential is available."
