name: GMLI monthly Radar research backtests

on:
  push:
    branches: [research/monthly-radar-backtest]
    paths:
      - 'research/monthly-radar-price-backtest.mjs'
      - 'research/monthly-radar-price-benchmark.mjs'
      - 'research/monthly-radar-money-cftc-backtest.mjs'
      - 'research/monthly-radar-short-macro-backtest.mjs'
      - 'research/monthly-radar-short-macro-baa-backtest.mjs'
      - 'research/monthly-radar-short-data-audit.mjs'
      - '.github/workflows/gmli-monthly-radar-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit macro data ranges
        run: node research/monthly-radar-short-data-audit.mjs
      - name: Run monthly price-only backtest
        run: node research/monthly-radar-price-backtest.mjs
      - name: Add asset-matched benchmark and recent-sample control
        run: node research/monthly-radar-price-benchmark.mjs
      - name: Run Money and CFTC conditioned backtest
        run: node research/monthly-radar-money-cftc-backtest.mjs
      - name: Run pre-specified macro short backtest with long-history BAA credit proxy
        run: node research/monthly-radar-short-macro-baa-backtest.mjs
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: gmli-monthly-radar-research-backtests
          path: |
            research/results/monthly-radar-price-backtest.json
            research/results/monthly-radar-money-cftc-backtest.json
            research/results/monthly-radar-short-macro-backtest.json
          if-no-files-found: error
          retention-days: 30
