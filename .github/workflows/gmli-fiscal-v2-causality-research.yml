name: GMLI Fiscal V2 informational causality research

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/fiscal-v2/CAUSALITY_RESEARCH_SPEC.json'
      - 'scripts/test-fiscal-v2-causality.py'
      - '.github/workflows/gmli-fiscal-v2-causality-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causality-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels
      - name: Guard frozen exploratory boundary
        run: |
          python - <<'PY'
          import json
          s=json.load(open('research/fiscal-v2/CAUSALITY_RESEARCH_SPEC.json'))
          assert s['status']=='FROZEN_BEFORE_EXPLORATORY_RUN'
          assert s['evidence_tier']=='RESEARCH'
          assert s['production_implication']=='NONE'
          assert s['granger']['fixed_lags_months']==[1,3,6]
          assert all(v is False for v in s['no_search'].values())
          assert s['automatic_global_conviction_weight_change']==0
          assert s['production_modified'] is False
          assert s['money_core_modified'] is False
          assert s['funding_v2_modified'] is False
          print('PASS_FISCAL_CAUSALITY_RESEARCH_BOUNDARY')
          PY
      - name: Run informational causality diagnostics
        run: |
          python -m py_compile scripts/test-fiscal-v2-causality.py
          python scripts/test-fiscal-v2-causality.py --as-of 2026-08-25 --output /tmp/fiscal-causality-result.json | tee /tmp/fiscal-causality-console.json
          grep -q '"status": "INFORMATIONAL_CAUSALITY_RESEARCH_COMPLETE"' /tmp/fiscal-causality-result.json
          grep -q '"causal_claim_allowed": false' /tmp/fiscal-causality-result.json
          grep -q '"production_implication": "NONE"' /tmp/fiscal-causality-result.json
          grep -q '"automatic_global_conviction_weight_change": 0' /tmp/fiscal-causality-result.json
      - name: Guard production separation
        run: |
          grep -q "version: 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL'" lib/state.js
          grep -q "version: 'GMLI_FUNDING_V2_EFFECTIVE_CONDITIONS'" lib/state.js
          grep -q "version: 'GMLI_FISCAL_V2_DEFICIT_IMPULSE'" lib/state.js
          grep -q "automatic_global_conviction_weight: 0" lib/state.js
          grep -q "fiscal_v2_automatic_weight: 0" lib/decision-engine.js
          grep -q "max: 10" lib/decision-engine.js
          echo 'PASS: causality research cannot alter production decision logic.'
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: gmli-fiscal-v2-causality-research
          path: /tmp/fiscal-causality-result.json
          if-no-files-found: error
          retention-days: 90
