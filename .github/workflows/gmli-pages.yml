name: GMLI GitHub Pages fallback

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'api/**'
      - 'lib/**'
      - 'scripts/build-pages-snapshot.mjs'
      - '.github/workflows/gmli-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'api/**'
      - 'lib/**'
      - 'scripts/build-pages-snapshot.mjs'
      - '.github/workflows/gmli-pages.yml'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gmli-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build verified static GMLI snapshot
        run: |
          set -euo pipefail
          node scripts/build-pages-snapshot.mjs | tee /tmp/gmli-pages.json
          grep -q 'PASS_GITHUB_PAGES_SNAPSHOT' /tmp/gmli-pages.json
          grep -q 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL' /tmp/gmli-pages.json
          grep -q '2026-07-31' /tmp/gmli-pages.json
          test -s .pages/index.html
          test -s .pages/api/report.json
          test -s .pages/api/radar.json

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
