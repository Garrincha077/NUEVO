name: GMLI GitHub Pages fetch-first fallback

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'api/**'
      - 'lib/**'
      - 'scripts/build-pages-snapshot.mjs'
      - 'scripts/refresh-pages-inputs.py'
      - 'scripts/pages-context-history.mjs'
      - 'scripts/pages-money-ui.mjs'
      - 'scripts/pages-mobile-info.mjs'
      - 'scripts/pages-signal-role-ui.mjs'
      - 'research/china-m2-official-v2/latest/**'
      - 'research/global-money-v2/latest/**'
      - 'research/global-money-v2/transfer/latest/**'
      - 'research/funding-v2/latest/**'
      - 'research/fiscal-v2/latest/**'
      - '.github/workflows/gmli-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'api/**'
      - 'lib/**'
      - 'scripts/build-pages-snapshot.mjs'
      - 'scripts/refresh-pages-inputs.py'
      - 'scripts/pages-context-history.mjs'
      - 'scripts/pages-money-ui.mjs'
      - 'scripts/pages-mobile-info.mjs'
      - 'scripts/pages-signal-role-ui.mjs'
      - 'research/china-m2-official-v2/latest/**'
      - 'research/global-money-v2/latest/**'
      - 'research/global-money-v2/transfer/latest/**'
      - 'research/funding-v2/latest/**'
      - 'research/fiscal-v2/latest/**'
      - '.github/workflows/gmli-pages.yml'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gmli-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate fetch-first orchestrator
        run: python -m py_compile scripts/refresh-pages-inputs.py

      - name: Fetch and guarded-refresh Pages inputs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python scripts/refresh-pages-inputs.py | tee /tmp/gmli-pages-refresh.json
          grep -Eq '"status": "PASS_FETCH_FIRST"|"status": "PASS_WITH_LAST_GOOD_FALLBACK"' /tmp/gmli-pages-refresh.json
          test -s audit/pages-refresh-status.json
          grep -q 'FETCH_FIRST_WITH_PER_LAYER_LAST_GOOD_FALLBACK' audit/pages-refresh-status.json

      - name: Build verified static GMLI snapshot
        run: |
          set -euo pipefail
          node scripts/build-pages-snapshot.mjs | tee /tmp/gmli-pages.json
          grep -q 'PASS_GITHUB_PAGES_SNAPSHOT' /tmp/gmli-pages.json
          grep -q 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL' /tmp/gmli-pages.json
          grep -q 'GMLI_FISCAL_V2_DEFICIT_IMPULSE' /tmp/gmli-pages.json
          grep -q 'GMLI_SIGNAL_ROLE_TAXONOMY_V1' /tmp/gmli-pages.json
          grep -q '"signal_role_scoring_effect": "NONE"' /tmp/gmli-pages.json
          grep -q '"fiscal_automatic_weight": 0' /tmp/gmli-pages.json
          grep -q '"report_schema": "gmli-report-v1.6"' /tmp/gmli-pages.json
          grep -q '"pages_context_ui": true' /tmp/gmli-pages.json
          grep -q '"pages_context_history_ui": true' /tmp/gmli-pages.json
          grep -q '"context_funding_history_rows"' /tmp/gmli-pages.json
          grep -q '"context_fiscal_history_rows"' /tmp/gmli-pages.json
          grep -q '"context_market_history_rows"' /tmp/gmli-pages.json
          grep -q '"money_available_date"' /tmp/gmli-pages.json
          grep -q '"fiscal_available_date"' /tmp/gmli-pages.json
          grep -q '"history_rows"' /tmp/gmli-pages.json
          grep -q '"static_api_files": 11' /tmp/gmli-pages.json
          test -s .pages/index.html
          for f in report radar history status decision current-market opportunity positioning money-nowcast context-history refresh-status; do
            test -s ".pages/api/${f}.json"
          done
          grep -q 'GMLI_FISCAL_V2_DEFICIT_IMPULSE' .pages/api/report.json
          grep -q 'GMLI_SIGNAL_ROLE_TAXONOMY_V1' .pages/api/report.json
          grep -q '"scoring_effect": "NONE"' .pages/api/report.json
          grep -q '"automatic_global_conviction_weight": 0' .pages/api/status.json
          grep -q '"fiscal_v2_automatic_weight": 0' .pages/api/decision.json
          grep -q '"schema_version": "gmli-pages-context-history-v1"' .pages/api/context-history.json
          grep -q '"historical_series": false' .pages/api/context-history.json
          grep -q 'research/funding-v2/latest/history.csv' .pages/api/context-history.json
          grep -q 'research/fiscal-v2/latest/history.csv' .pages/api/context-history.json
          grep -q '"schema_version": "gmli-pages-refresh-v1"' .pages/api/refresh-status.json
          grep -q 'LIVE_DURING_REPORT_BUILD' .pages/api/refresh-status.json
          grep -q 'Global Money Trend' .pages/index.html
          grep -q 'id="contextLayers"' .pages/index.html
          grep -q 'Context History' .pages/index.html
          grep -q 'contextFundingHistoryChart' .pages/index.html
          grep -q 'contextFiscalHistoryChart' .pages/index.html
          grep -q 'contextMarketHistoryChart' .pages/index.html
          grep -q 'FISCAL V2' .pages/index.html
          grep -q 'SIGNAL ROLE CHAIN' .pages/index.html
          grep -q 'CONTEXT</a>' .pages/index.html
          grep -q 'moneyScoreChart' .pages/index.html
          grep -q 'moneyYoyChart' .pages/index.html
          grep -q 'infoPopover' .pages/index.html
          grep -q 'Više informacija' .pages/index.html
          grep -q 'Refresh audit' .pages/index.html
          if grep -q 'gmli-fred-dashboard.vercel.app/api/' .pages/index.html; then
            echo 'Pages still depends on Vercel API links' >&2
            exit 1
          fi

      - name: Publish verified static snapshot to gh-pages branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -a .pages/. "$work/"
          cd "$work"
          git init -q
          git config user.name 'gmli-pages-bot'
          git config user.email 'gmli-pages-bot@users.noreply.github.com'
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Publish fetch-first verified GMLI Pages snapshot ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin HEAD:gh-pages
          echo "Fetch-first static snapshot published to gh-pages branch."

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
