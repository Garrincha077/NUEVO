name: GMLI Funding V2 research gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/funding-v2-contract.json'
      - 'research/funding-v2/CANDIDATE_1_RESULT.json'
      - 'research/funding-v2-candidate-2-contract.json'
      - 'scripts/build-funding-v2.py'
      - 'scripts/build-funding-v2-candidate2.py'
      - '.github/workflows/gmli-funding-v2-research.yml'
  workflow_dispatch:

jobs:
  funding-v2-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard Candidate 1 frozen rejection and Candidate 2 contract
        run: |
          python - <<'PY'
          import json
          c1 = json.load(open('research/funding-v2-contract.json', encoding='utf-8'))
          r1 = json.load(open('research/funding-v2/CANDIDATE_1_RESULT.json', encoding='utf-8'))
          c2 = json.load(open('research/funding-v2-candidate-2-contract.json', encoding='utf-8'))
          assert c1['candidate_version'] == 'GMLI_FUNDING_V2_CANDIDATE_1'
          assert r1['candidate_version'] == 'GMLI_FUNDING_V2_CANDIDATE_1'
          assert r1['decision'] == 'REJECTED_FOR_PROMOTION'
          assert r1['gate'] == 'FAIL_FIXED_DIRECTIONAL_SANITY'
          assert c2['candidate_version'] == 'GMLI_FUNDING_V2_CANDIDATE_2'
          assert c2['status'] == 'FROZEN_RESEARCH_CANDIDATE'
          assert c2['production_replacement_allowed'] is False
          assert c2['money_core_modified'] is False
          assert c2['aggregation']['effective_funding_score'] == 'min(structural_support_score, observed_conditions_score)'
          assert c2['aggregation']['tuned_override_parameter'] is False
          assert c2['standardization']['window_months'] == 120
          assert c2['publication_lag_months'] == 1
          print('PASS_FUNDING_V2_CANDIDATE_2_FROZEN_CONTRACT')
          PY
      - name: Run Candidate 2 fixed directional gate
        shell: bash
        run: |
          python -m py_compile scripts/build-funding-v2.py scripts/build-funding-v2-candidate2.py
          rm -rf /tmp/gmli-funding-v2-candidate2
          python scripts/build-funding-v2-candidate2.py --as-of 2026-08-25 --build-full --output-dir /tmp/gmli-funding-v2-candidate2 > /tmp/gmli-funding-v2-candidate2.json
          cat /tmp/gmli-funding-v2-candidate2.json
          grep -q '"candidate_version": "GMLI_FUNDING_V2_CANDIDATE_2"' /tmp/gmli-funding-v2-candidate2.json
          grep -q '"production_modified": false' /tmp/gmli-funding-v2-candidate2.json
          grep -q '"money_core_modified": false' /tmp/gmli-funding-v2-candidate2.json
          grep -q '"parameter_search": false' /tmp/gmli-funding-v2-candidate2.json
          grep -q '"available_date": "2026-07-31"' /tmp/gmli-funding-v2-candidate2.json
          grep -q '"directional_gate_pass": true' /tmp/gmli-funding-v2-candidate2.json
          grep -q '"promotion_eligible": false' /tmp/gmli-funding-v2-candidate2.json
          grep -q '"promotion_blocker": "NARROW_USEFULNESS_CONVICTION_GATE_NOT_RUN"' /tmp/gmli-funding-v2-candidate2.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/gmli-funding-v2-candidate2.json', encoding='utf-8'))
          legacy = result['legacy_current_comparator']
          assert legacy['gate_scope'] == 'FROZEN_INITIAL_PROMOTION_GATE'
          assert legacy['available_date'] == '2026-07-31'
          assert legacy['candidate_available_date'] == '2026-07-31'
          assert legacy['candidate_regime'] == legacy['regime'] == 'RESTRICTIVE'
          assert legacy['direction_match'] is True
          print('PASS_FUNDING_V2_FIXED_INITIAL_LEGACY_GATE')
          PY
          test -s /tmp/gmli-funding-v2-candidate2/summary.json
          test -s /tmp/gmli-funding-v2-candidate2/history.csv
      - name: Upload Candidate 2 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmli-funding-v2-candidate-2
          path: /tmp/gmli-funding-v2-candidate2
          if-no-files-found: error
      - name: Guard promoted production separation
        run: |
          grep -q "version: 'GMLI_FUNDING_V2_EFFECTIVE_CONDITIONS'" lib/state.js
          grep -q "status: 'OVERLAY'" lib/state.js
          grep -q "historical_reference" lib/state.js
          grep -q "version: 'GMLI_FUNDING_LEGACY_JULY_2026'" lib/state.js
          grep -q "version: 'GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL'" lib/state.js
          grep -q "version: 'GMLI_FUNDING_V2_EFFECTIVE_CONDITIONS'" lib/overlay-refresh-status.js
          grep -q "automation_status: 'ACTIVE_GUARDED_REFRESH'" lib/overlay-refresh-status.js
          echo 'Candidate 2 remains the promoted Funding OVERLAY; legacy Funding stays historical and Money Core is unchanged.'
