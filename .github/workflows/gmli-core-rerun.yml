name: GMLI frozen Core final promotion gate

on:
  push:
    branches: [core-promotion-rerun]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic fail-closed promotion audit
        run: python scripts/finalize-v18b-core-promotion.py
      - name: Show final decision
        run: cat audit/v18b-final-core-promotion-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: gmli-v18b-final-core-promotion-audit
          path: audit/v18b-final-core-promotion-audit.json
          if-no-files-found: error
