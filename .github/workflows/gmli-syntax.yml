name: GMLI source checks
on:
  push:
    branches: [main, gmli-fred-dashboard]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check serverless and library JavaScript
        run: |
          find api lib -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Guard frozen Core reference
        run: |
          grep -q "available_date: '2026-02-28'" lib/state.js
          grep -q "usd_score: 65.70290344348" lib/state.js
          grep -q "fxn_score: 43.01411281977772" lib/state.js
