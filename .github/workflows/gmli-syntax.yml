name: GMLI source checks
on:
  push:
    branches: [main, gmli-fred-dashboard]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check serverless and library JavaScript
        run: |
          find api lib -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check GMLI Python scripts
        run: |
          python -m compileall -q scripts
      - name: Validate documented prospective source URLs
        run: |
          python scripts/validate-prospective-money-sources.py --ids GB_M4,CA_M2,JP_M2,ASSET_ADJUSTED_PRICE_MIRROR
      - name: Validate official PBoC China nowcast parser
        run: |
          python scripts/refresh-money-nowcast.py --validate-china-only > /tmp/gmli-pboc-validation.json
          grep -q '"status": "PASS"' /tmp/gmli-pboc-validation.json
          grep -q '"state_modified": false' /tmp/gmli-pboc-validation.json
          grep -q '"level_trn_cny"' /tmp/gmli-pboc-validation.json
          grep -q '"yoy_pct"' /tmp/gmli-pboc-validation.json
          grep -q '"article_sha256"' /tmp/gmli-pboc-validation.json
      - name: Validate official PBoC M2 v2 HTML history contract
        shell: bash
        run: |
          set +e
          python scripts/build-pboc-m2-official-v2.py --validate-only > /tmp/gmli-pboc-v2-validation.json
          code=$?
          set -e
          cat /tmp/gmli-pboc-v2-validation.json
          test "$code" -eq 0
          grep -q '"status": "PASS"' /tmp/gmli-pboc-v2-validation.json
          grep -q '"candidate_version": "PBOC_OFFICIAL_M2_V2"' /tmp/gmli-pboc-v2-validation.json
          grep -q '"source_contract": "PBOC_OFFICIAL_HTML_MONEY_SUPPLY_TABLES"' /tmp/gmli-pboc-v2-validation.json
          grep -q '"core_modified": false' /tmp/gmli-pboc-v2-validation.json
          grep -q '"legacy_exact_rerun": false' /tmp/gmli-pboc-v2-validation.json
          grep -q '"2015-01"' /tmp/gmli-pboc-v2-validation.json
          grep -q '"2018-12"' /tmp/gmli-pboc-v2-validation.json
          grep -q '"2021-12"' /tmp/gmli-pboc-v2-validation.json
          grep -q '"2026-07"' /tmp/gmli-pboc-v2-validation.json
      - name: Discover lockable PBoC 2015 growth URLs
        shell: bash
        run: |
          python scripts/discover-pboc-2015-growth-urls.py | tee /tmp/gmli-pboc-2015-urls.json
          grep -q '"status": "PASS_LOCKABLE_2015_PBOC_GROWTH_URLS"' /tmp/gmli-pboc-2015-urls.json
          grep -q '"count": 12' /tmp/gmli-pboc-2015-urls.json
      - name: Build and validate PBoC comparable-base seed
        shell: bash
        run: |
          set +e
          python scripts/extend-pboc-m2-v2-2014.py --build-full > /tmp/gmli-pboc-v2-2014.json
          code=$?
          set -e
          cat /tmp/gmli-pboc-v2-2014.json
          test "$code" -eq 0
          grep -q '"status": "PASS_CONTINUOUS_OFFICIAL_V2_SOURCE_WITH_COMPARABLE_BASE_SEED"' /tmp/gmli-pboc-v2-2014.json
          grep -q '"start_month": "2014-01"' /tmp/gmli-pboc-v2-2014.json
          grep -q '"missing_months": \[\]' /tmp/gmli-pboc-v2-2014.json
          grep -q '"core_modified": false' /tmp/gmli-pboc-v2-2014.json
          grep -q '"legacy_exact_rerun": false' /tmp/gmli-pboc-v2-2014.json
          grep -q '"role": "ACCOUNTING_SEED_ONLY"' /tmp/gmli-pboc-v2-2014.json
          grep -q '"observed_stock": false' /tmp/gmli-pboc-v2-2014.json
          grep -q '"status": "PASS_OFFICIAL_COMPONENT_DERIVATION"' /tmp/gmli-pboc-v2-2014.json
          grep -q '"historical_2014_extension": null' /tmp/gmli-pboc-v2-2014.json
      - name: Build Global Money v2 headline candidate
        shell: bash
        run: |
          set +e
          python scripts/run-global-money-v2.py --build-full > /tmp/gmli-global-money-v2.json
          code=$?
          set -e
          cat /tmp/gmli-global-money-v2.json
          test "$code" -eq 0
          grep -q '"status": "PASS_GLOBAL_MONEY_V2_HEADLINE"' /tmp/gmli-global-money-v2.json
          grep -q '"candidate_version": "GMLI_GLOBAL_MONEY_V2_PBOC_OFFICIAL"' /tmp/gmli-global-money-v2.json
          grep -q '"core_modified": false' /tmp/gmli-global-money-v2.json
          grep -q '"status": "PASS"' /tmp/gmli-global-money-v2.json
          grep -q '"start_month": "2015-01"' /tmp/gmli-global-money-v2.json
          grep -q '"next_gate": "FIXED_TRANSMISSION_TRANSFER_TEST"' /tmp/gmli-global-money-v2.json
      - name: Run fixed Global Money v2 transmission transfer gate
        shell: bash
        run: |
          set +e
          python scripts/test-global-money-v2-transmission.py --build-full > /tmp/gmli-v2-transfer.json
          code=$?
          set -e
          cat /tmp/gmli-v2-transfer.json
          test "$code" -eq 0
          grep -q '"status": "PASS_FIXED_TRANSMISSION_DIRECTION_TRANSFER"' /tmp/gmli-v2-transfer.json
          grep -q '"passed_relations": 6' /tmp/gmli-v2-transfer.json
          grep -q '"total_relations": 6' /tmp/gmli-v2-transfer.json
          grep -q '"parameter_search": false' /tmp/gmli-v2-transfer.json
          grep -q '"lag_search": false' /tmp/gmli-v2-transfer.json
          grep -q '"horizon_search": false' /tmp/gmli-v2-transfer.json
          grep -q '"asset_search": false' /tmp/gmli-v2-transfer.json
          grep -q '"fdr_claim": false' /tmp/gmli-v2-transfer.json
          grep -q '"core_modified": false' /tmp/gmli-v2-transfer.json
          grep -q 'PROMOTION_REPORT_AND_PRODUCTION_INTEGRATION_REVIEW' /tmp/gmli-v2-transfer.json
      - name: Validate prospective Fiscal raw capture
        run: |
          python scripts/capture-prospective-fiscal-inputs.py --validate-only > /tmp/gmli-fiscal-capture-validation.json
          grep -q '"status": "PASS"' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"state_modified": false' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"production_state_modified": false' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"strict_release_ready": false' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"MTSDS133FMS"' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"GDP"' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"GFDEBTN"' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"A091RC1Q027SBEA"' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"FGRECPT"' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"FGEXPND"' /tmp/gmli-fiscal-capture-validation.json
          grep -q '"raw_sha256"' /tmp/gmli-fiscal-capture-validation.json
      - name: Guard frozen Core reference
        run: |
          grep -q "available_date: '2026-02-28'" lib/state.js
          grep -q "usd_score: 65.70290344348" lib/state.js
          grep -q "fxn_score: 43.01411281977772" lib/state.js
      - name: Verify legacy prospective capture still fails closed on old China contract
        shell: bash
        run: |
          set +e
          python scripts/capture-prospective-money-inputs.py --vintage 2099-01 > /tmp/gmli-capture-test.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'BLOCKED_UNRESOLVED_REQUIRED_SOURCES' /tmp/gmli-capture-test.json
          grep -q '"CN_M2"' /tmp/gmli-capture-test.json
          grep -q '"core_modified": false' /tmp/gmli-capture-test.json
          echo 'Historical v1.8b exact-capture path remains blocked; the official PBoC v2 candidate is intentionally a separate versioned path.'
