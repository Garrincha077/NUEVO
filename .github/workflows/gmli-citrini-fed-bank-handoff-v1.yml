name: GMLI Citrini Fed-bank handoff v1

on:
  push:
    branches:
      - research/citrini-fed-bank-handoff-v1
    paths:
      - 'research/citrini-fed-bank-handoff-v1/**'
      - '.github/workflows/gmli-citrini-fed-bank-handoff-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests statsmodels

      - name: Run frozen handoff gate
        run: |
          set -euo pipefail
          python research/citrini-fed-bank-handoff-v1/run_gate.py | tee /tmp/citrini-fed-bank-handoff.log
          test -s research/citrini-fed-bank-handoff-v1/out/HANDOFF_STATES.csv
          test -s research/citrini-fed-bank-handoff-v1/out/RELATION_RESULTS.csv
          test -s research/citrini-fed-bank-handoff-v1/out/PHASE_RESULTS.csv
          test -s research/citrini-fed-bank-handoff-v1/out/RESULT_SUMMARY.json
          test -s research/citrini-fed-bank-handoff-v1/out/RESULT_SUMMARY.md
          grep -q 'RESEARCH_DIAGNOSTIC' research/citrini-fed-bank-handoff-v1/out/RESULT_SUMMARY.json
          grep -q '"scoring_effect": "NONE"' research/citrini-fed-bank-handoff-v1/out/RESULT_SUMMARY.json
          grep -q '"automatic_weight_change": 0' research/citrini-fed-bank-handoff-v1/out/RESULT_SUMMARY.json
          grep -q '"parameter_search": false' research/citrini-fed-bank-handoff-v1/out/RESULT_SUMMARY.json

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: citrini-fed-bank-handoff-v1
          path: research/citrini-fed-bank-handoff-v1/out/
          if-no-files-found: error
